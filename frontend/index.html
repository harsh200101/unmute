<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="apple-touch-icon" href="/images/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <title>unmute</title>
    <!--
      Pre-paint dark-mode boot. Reads the user's saved choice (or system pref)
      and sets `class="dark"` on <html> BEFORE React mounts, so users on dark
      mode don't see a white flash on load.
    -->
    <script>
      (function () {
        try {
          var c = localStorage.getItem('unmute_theme') || 'system';
          var dark = c === 'dark' ||
            (c === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <!--
      Razorpay Standard Checkout. Loads `window.Razorpay`, which the wallet uses
      to open the payment modal when PAYMENT_GATEWAY=razorpay. Harmless when the
      PhonePe gateway is selected (the script just sits unused).
    -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
